# ==============================================================================
# RestroAstra — Isolated Nginx Virtual Host Configuration for VPS
# Tagline: One platform. Every restaurant operation.
# Dedicated Domain: restroastra.com & www.restroastra.com
# ==============================================================================
# Upstream to isolated RestroAstra Node.js process (Port 3005)
# This guarantees complete isolation from other services running on ports 3000/3001.
# ==============================================================================

upstream restroastra_upstream {
    server 127.0.0.1:3005;
    keepalive 64;
}

server {
    server_name restroastra.com www.restroastra.com;

    client_max_body_size 35M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ACME Challenge for Let's Encrypt / Certbot renewal verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Next.js Static Asset Caching
    location /_next/static/ {
        proxy_pass http://restroastra_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads direct static caching
    location /uploads/ {
        proxy_pass http://restroastra_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Main Application Proxy + Socket.io WebSockets
    location / {
        proxy_pass http://restroastra_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade headers for persistent live order notifications & chat
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Persistent timeouts for Socket.io connections
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/restroastra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restroastra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.restroastra.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = restroastra.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name restroastra.com www.restroastra.com;
    return 404;
}
