# ==============================================================================
# RestroAstra — Isolated Nginx Virtual Host Configuration for VPS
# Tagline: One platform. Every restaurant operation.
# ==============================================================================
# Upstream to isolated RestroAstra Node.js process (Port 3005)
# This guarantees complete isolation from other services running on ports 3000/3001.
# ==============================================================================

upstream restroastra_upstream {
    server 127.0.0.1:3005;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Redirect to HTTPS & ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name NEW_APP_DOMAIN www.NEW_APP_DOMAIN;

    # Let's Encrypt / Certbot renewal verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS once SSL certificate is installed
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Production RestroAstra Virtual Host
# (Activate this block once SSL certificate has been issued via Certbot)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name NEW_APP_DOMAIN www.NEW_APP_DOMAIN;

    # SSL Certificate configuration (Certbot will manage these paths)
    ssl_certificate /etc/letsencrypt/live/NEW_APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/NEW_APP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Upload size limit matching Next.js application limits (35MB)
    client_max_body_size 35M;

    # Advanced Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Next.js Static Asset Caching
    location /_next/static/ {
        proxy_pass http://restroastra_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads direct static caching
    location /uploads/ {
        proxy_pass http://restroastra_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Main Application Proxy + Socket.io WebSockets
    location / {
        proxy_pass http://restroastra_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade headers for persistent live order notifications & chat
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Persistent timeouts for Socket.io connections
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
