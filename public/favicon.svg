<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="astraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7BE" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8A6941" />
    </linearGradient>
    <linearGradient id="astraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B20" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <filter id="astraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect width="512" height="512" rx="128" fill="url(#astraBg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#astraGold)" stroke-opacity="0.35" stroke-width="4" />

  <!-- Outer Astra Halo Ring -->
  <circle cx="256" cy="256" r="176" stroke="url(#astraGold)" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 8" />

  <!-- 8-Point Astra Star -->
  <g filter="url(#astraGlow)">
    <path d="M256 64 L276 228 L440 256 L276 284 L256 448 L236 284 L72 256 L236 228 Z" fill="url(#astraGold)" opacity="0.9" />
    <path d="M256 128 L270 236 L384 256 L270 276 L256 384 L242 276 L128 256 L242 236 Z" fill="url(#astraGold)" opacity="0.45" />
  </g>

  <!-- Central Emblem: Elegant Crossed Cutlery & Diamond Spark -->
  <path d="M210 220 L235 256 L180 340 C175 348 164 348 159 342 C154 337 154 326 162 321 Z" fill="#FAF8F5" />
  <path d="M302 220 L277 256 L332 340 C337 348 348 348 353 342 C358 337 358 326 350 321 Z" fill="#FAF8F5" />

  <!-- Central Celestial Jewel -->
  <circle cx="256" cy="256" r="28" fill="#121316" stroke="url(#astraGold)" stroke-width="4" />
  <polygon points="256,238 262,256 256,274 250,256" fill="url(#astraGold)" />
  <polygon points="238,256 256,262 274,256 256,250" fill="url(#astraGold)" />
  <circle cx="256" cy="256" r="4" fill="#FAF8F5" />
</svg>
